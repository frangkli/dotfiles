# Set in login shells and in Claude Code's and Codex's agent environments, which skip ~/.profile.
toolEnv:
  # CLI telemetry opt-outs (Neon has no environment switch).
  CF_SEND_TELEMETRY: "false"
  SENTRY_CLI_NO_TELEMETRY: "1"
  CTX7_TELEMETRY_DISABLED: "1"
  IMPECCABLE_NO_TELEMETRY: "1"
  AGENTSVIEW_TELEMETRY_ENABLED: "0"
  # impeccable's design hook reports findings only, not a note on every clean UI edit.
  IMPECCABLE_HOOK_QUIET: "1"
